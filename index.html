<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- 카카오톡 / 메신저 링크 공유 미리보기 (전자결재 위장) -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="[전자결재] 긴급 결재 및 열람 요청 건">
  <meta property="og:description" content="미결재 보안 문서(PDF)가 도착했습니다. 열람 기한 내 확인 후 승인해 주시기 바랍니다.">
  <meta property="og:image" content="https://ssl.pstatic.net/static/pwe/address/img_profile_default.png">

  <title>통합 그룹웨어 전자결재 시스템</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      background-color: #f1f5f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* 사내 보안 문서 / 전자결재 위장 카드 UI */
    .fake-doc-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
      max-width: 460px;
      width: 90%;
      overflow: hidden;
      animation: fadeIn 0.3s ease-out;
    }

    .card-header {
      background-color: #0f172a;
      color: #ffffff;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .card-header .badge {
      background-color: #ef4444;
      color: #ffffff;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 4px;
      letter-spacing: 0.5px;
    }
    .card-header .system-title {
      font-size: 13px;
      font-weight: 500;
      color: #94a3b8;
    }

    .card-body {
      padding: 28px 24px 32px;
      text-align: center;
    }
    .doc-icon {
      width: 52px;
      height: 52px;
      background-color: #eff6ff;
      color: #2563eb;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      margin-bottom: 16px;
    }
    .fake-doc-card h2 {
      font-size: 18px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 10px;
      line-height: 1.4;
    }
    .fake-doc-card p {
      font-size: 13px;
      color: #64748b;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    /* 문서 정보 테이블 */
    .doc-meta {
      background-color: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 12px 16px;
      margin-bottom: 24px;
      text-align: left;
      font-size: 12px;
    }
    .doc-meta-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .doc-meta-row:last-child {
      margin-bottom: 0;
    }
    .doc-meta-label {
      color: #64748b;
    }
    .doc-meta-value {
      font-weight: 600;
      color: #1e293b;
    }

    .open-btn {
      width: 100%;
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      padding: 14px 0;
      font-size: 15px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.15s ease, transform 0.05s ease;
      box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.2);
    }
    .open-btn:hover {
      background-color: #1d4ed8;
    }
