<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- 카카오톡/메신저 링크 공유 시 낚시용 미리보기 메타태그 -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="[공유] 2026년도 하반기 업무 협조 요청의 건">
  <meta property="og:description" content="클라우드 저장소에 보관된 문서를 열람하려면 클릭하십시오.">
  <meta property="og:image" content="https://ssl.pstatic.net/static/pwe/address/img_profile_default.png">
  <title>문서 열람 시스템</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #f4f6f8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    /* 업무용 페이지 위장 카드 UI */
    .fake-doc-card {
      background: #ffffff;
      padding: 40px 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      max-width: 440px;
      width: 100%;
      text-align: center;
      display: block;
    }

    .fake-doc-card h2 {
      font-size: 20px;
      color: #1e293b;
      margin-bottom: 12px;
    }

    .fake-doc-card p {
      font-size: 14px;
      color: #64748b;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .open-btn {
      width: 100%;
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      padding: 14px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .open-btn:hover {
      background-color: #1d4ed8;
    }

    /* 장난 화면 (클릭 전 숨김) */
    #prank-screen {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #000000;
      z-index: 999999;
      justify-content: center;
      align-items: center;
    }

    #prank-screen img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
  </style>
</head>
<body>

  <!-- 1. 위장 업무 카드 -->
  <div class="fake-doc-card" id="doc-card">
    <h2>보안 문서 열람</h2>
    <p>요청하신 기획서 및 결재 파일이 준비되었습니다.<br>아래 버튼을 눌러 확인하십시오.</p>
    <button type="button" class="open-btn" onclick="triggerPrank()">문서 열람 (PDF)</button>
  </div>

  <!-- 2. 장난 레이어 -->
  <div id="prank-screen">
    <img src="https://img.etnews.com/news/article/2024/03/16/cms_temp_stats_17105737071912665080.jpg" 
         alt="Prank Image" 
         id="prank-img" 
         referrerpolicy="no-referrer">
    <audio id="prank-audio" src="./1.mp3" preload="auto"></audio>
  </div>

  <script>
    function triggerPrank() {
      // 1. 화면 전환
      const docCard = document.getElementById('doc-card');
      const prankScreen = document.getElementById('prank-screen');

      if (docCard) docCard.style.display = 'none';
      if (prankScreen) prankScreen.style.display = 'flex';

      // 2. 오디오 재생
      const audio = document.getElementById('prank-audio');
      if (audio) {
        audio.currentTime = 0;
        audio.volume = 1.0;
        const playPromise = audio.play();
        if (playPromise !== undefined) {
          playPromise.catch(function(err) {
            console.warn("오디오 재생 실패:", err);
          });
        }
      }

      // 3. 전체화면
      if (prankScreen.requestFullscreen) {
        prankScreen.requestFullscreen().catch(function() {});
      } else if (prankScreen.webkitRequestFullscreen) {
        prankScreen.webkitRequestFullscreen().catch(function() {});
      }
    }
  </script>
</body>
</html>
